version: "1.3"
project_context: "Spec-Driven Development (SDD)"

artifacts:
  proposal:
    path: "docs/proposal.md"
    template_path: "templates/proposal_template.md"
    required_sections: ["Problem Statement", "Value Proposition", "Goals", "Success Metrics"]

  spec:
    path: "docs/spec.md"
    template_path: "templates/spec_template.md"
    strict_hierarchy: 
      level_1: "Feature (##)"
      level_2: "User Requirement (###)"
      level_3: "User Story (####)"
      level_4: "Functional Requirements & UX/UI Considerations"
      level_5: "Acceptance Criteria (Gherkin)"
    prioritization:
      scale: ["P0", "P1", "P2", "P3"]
      rule: "Every User Story title must append a priority tag (e.g., [P0])."

  design:
    path: "docs/design.md"
    template_path: "templates/design_template.md"
    required_sections: ["Architecture Overview", "Data Architechture", "API Design", "Global Error & Resilience Strategy", "Security & Privacy", "User Interface Specifications"]

  tasks:
    path: "docs/tasks.md"
    template_path: "templates/tasks_template.md"
    formatting_rules:
      mandatory_tags: ["[FE]", "[BE]", "[UI]", "[DEVOPS]", "[ERROR]"]
      mandatory_fields: ["Tag", "Task ID", "Description", "Reference"]
      reference_logic: "Every task must link to a Story ID or AC Scenario from spec.md via relative markdown links."

agent_logic:
  header_integrity: "STRICT: Do not change markdown header levels (###/####). Fill placeholders only."
  linking_rule: "All Task References must use relative markdown links to the spec.md anchor. Format: [Ref: Story ID](./spec.md#header-slug)"
  error_handling_mandate:
    rule: "For every 'Positive Scenario' in spec.md, the agent MUST generate at least one 'Negative Scenario' (Error Case)."
    focus_areas: ["Network Failure", "Validation Error", "Permission Denied", "Timeout"]
  priority_definitions:
    P0_Critical: "Mission-critical. App unusable without this. (e.g. Auth, Basic CRUD)."
    P1_High: "Core experience. High user impact but functioning app."
    P2_Medium: "Enhancements, Animations, or Aesthetic polish."
    P3_Low: "Backlog/Delight items for future iterations."
