name: my-custom-workflow
version: 1
description: "A workflow with enforced template paths"


# OpenSpec 1.3+ Prescriptive Paths
artifacts:
  - id: proposal
    generate: proposal.md #
    description: "initial proposal document"
    template: "c_proposal_template.md"
    required_sections: ["Value Proposition", "Problem Statement", "Target Audience", "USP", "Target Platforms", "Goals", "Non-Goals (Out of Scope)", "Success Metrics", "Monetization", "Critical Questions or Clarifications"]
    requires: []

  - id: specs
    generate: "{{specsPath}}/{{changeName}}_spec.md"
    description: "Technical Specification"
    template: "c_spec_template.md"
    strict_hierarchy: 
      level_1: "Feature (##)"
      level_2: "User Requirement (###)"
      level_3: "User Story (####)"
      level_4: "Functional Requirements & UX/UI Considerations"
      level_5: "Acceptance Criteria (Gherkin)"
    prioritization:
      scale: ["P0", "P1", "P2", "P3"]
      rule: "Every User Story title must append a priority tag (e.g., [P0])."
      requires: []

  - id: design
    generate: "design.md"
    description: "design document"
    template: "c_design_template.md"
    required_sections: ["Architecture Overview", "Data Architechture", "API Design", "Global Error & Resilience Strategy", "Security & Privacy", "User Interface Specifications"]
    requires: [spec.md]
    

  - id: tasks
    generate: "tasks.md"
    description: "tasks document"
    template: "c_tasks_template.md"
    formatting_rules:
      mandatory_tags: ["[FE]", "[BE]", "[UI]", "[DEVOPS]", "[ERROR]"]
      mandatory_fields: ["Tag", "Task ID", "Description", "Reference"]
      reference_logic: "Every task   link to a Story ID or AC Scenario from spec.md via relative markdown links."

    
agent_logic:
  header_integrity: "STRICT: Do not change markdown header levels (###/####). Fill placeholders only."
  linking_rule: "Link tasks to spec anchors: [Ref: Story](./specs/<capability>/spec.md#header)"
  error_handling_mandate:
    rule: "For every 'Positive Scenario' in spec.md, the agent MUST generate at least one 'Negative Scenario' (Error Case)."
    focus_areas: ["Network Failure", "Validation Error", "Permission Denied", "Timeout"]
  priority_assignment: "When generating stories, evaluate the impact on the 'Happy Path' of the user. If the path breaks without the story, assign P0."
  priority_definitions:
    P0_Critical: "Mission-critical. App unusable without this. (e.g. Auth, Basic CRUD)."
    P1_High: "Core experience. High user impact but functioning app."
    P2_Medium: "Enhancements, Animations, or Aesthetic polish."
    P3_Low: "Backlog/Delight items for future iterations."
task_tags:
  FE: "Frontend - UI components, React/Vue logic, browser APIs."
  BE: "Backend - Server logic, DB schemas, API endpoints."
  UI: "User Interface - Design system, CSS, WCAG accessibility."
  DEVOPS: "Infrastructure, CI/CD, and Hosting."
  ERROR: "Exception handling, Validation, and Recovery paths."
